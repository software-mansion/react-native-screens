name: Test Android e2e
on:
  pull_request:
    # The defaults plus ready_for_review, so marking a draft ready starts a run.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    # PRs run the suite only when the suite itself changes. Library changes
    # are tested once they land on main (see `push`).
    paths:
      - '.github/workflows/android-e2e-test-fabric.yml'
      - 'FabricExample/.detoxrc.js'
      - 'FabricExample/e2e/**'
      - 'scripts/e2e/**'
      - '.github/actions/argent-server/**'
      - '.github/actions/install-node-deps/**'
      - '.argent/**'
      - 'react-native-screens-testing'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-e2e-test-fabric.yml'
      - '.github/actions/argent-server/**'
      - '.github/actions/install-node-deps/**'
      - '.argent/**'
      - 'react-native-screens-testing'
      - 'package.json'
      - 'android/**'
      - 'common/**'
      - 'cpp/**'
      - 'src/**'
      - 'FabricExample/**'
      - 'apps/**'
      - 'scripts/e2e/**'
  workflow_dispatch:
    inputs:
      argent-only:
        description: Skip the Detox tests; only build the app and run the Argent flows.
        type: boolean
        default: false
concurrency:
  # Manual runs get their own group, so dispatching twice does not cancel the
  # first run.
  group: android-e2e-fabric-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip draft PRs and, in a PR stack, every PR but the lowest unmerged one.
    # Pushes and manual runs carry no `pull_request`, so they always run. The
    # test and argent jobs need this one, so they are skipped with it.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.pull_request.stack == null ||
       github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref)
    env:
      WORKING_DIRECTORY: FabricExample
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Install node dependencies
        uses: ./.github/actions/install-node-deps
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Build app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build-e2e-android

      # Hands the release build to the test and argent jobs (they run on
      # separate machines). The whole apk/ dir: Detox also needs the test APK
      # (androidTest/release/app-release-androidTest.apk), Argent only the app.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apk
          path: ${{ env.WORKING_DIRECTORY }}/android/app/build/outputs/apk
          retention-days: 1

  test:
    # Detox and Argent run in parallel on separate machines, both on the app
    # built once above.
    needs: build
    if: ${{ !inputs.argent-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKING_DIRECTORY: FabricExample
      API_LEVEL: 34
      AVD_PROFILE: pixel_7
      AVD_CORES: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node dependencies
        uses: ./.github/actions/install-node-deps
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}

      # Unpacked where Detox's android.release binaryPath expects it.
      - name: Download APKs built by the build job
        uses: actions/download-artifact@v4
        with:
          name: build-android-apk
          path: ${{ env.WORKING_DIRECTORY }}/android/app/build/outputs/apk

      - name: Install AVD dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libpulse0 libgl1 libxkbfile1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # A snapshot only loads on the hardware config it was taken with.
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-${{ env.AVD_CORES }}cores

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: '4096M'
          disk-size: '10G'
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          avd-name: e2e_emulator
          arch: x86_64
          script: echo "Generated AVD snapshot for caching."

      - name: Run emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          api-level: ${{ env.API_LEVEL }}
          target: default
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: '4096M'
          disk-size: '10G'
          disable-animations: false
          force-avd-creation: false
          # No snapshot on shutdown: on a cache hit nothing reads it, and on a miss it
          # would replace the clean snapshot from the step above in the saved cache.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          avd-name: e2e_emulator
          arch: x86_64
          script: yarn test-e2e-android

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: android-fail-screen-shots
          path: ${{ env.WORKING_DIRECTORY }}/artifacts

  argent:
    # Argent flows on the same release build, in parallel with Detox: own time
    # budget and a fresh emulator.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_LEVEL: 34
      AVD_PROFILE: pixel_7
      AVD_CORES: 4
      # The emulator advertises its gRPC console in
      # $XDG_RUNTIME_DIR/avd/running/pid_*.ini, which is where Argent's Android
      # backend looks for it. The variable is unset on runners, so pin it.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Baselines live in the react-native-screens-testing submodule
      # (.argent/flows/__baselines__ is a symlink into it).
      - name: Fetch Argent baselines
        run: git submodule update --init --depth 1 react-native-screens-testing

      # Only needed to run the Argent CLI — the APK is downloaded, not built.
      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Where scripts/e2e/run-argent-flows-android.sh installs it from.
      - name: Download APKs built by the build job
        uses: actions/download-artifact@v4
        with:
          name: build-android-apk
          path: FabricExample/android/app/build/outputs/apk

      - name: Install AVD dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libpulse0 libgl1 libxkbfile1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator ignores XDG_RUNTIME_DIR if it does not exist, so create it
      # before booting. 0700 per the XDG spec.
      - name: Prepare shared XDG_RUNTIME_DIR
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

      # Same AVD (pixel_7, 1080x2400 — the geometry of the committed Android
      # baselines) as the test job; restored from its cache when present.
      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-${{ env.AVD_CORES }}cores

      # Host process; it outlives this step and serves the emulator boot below.
      - name: Install Argent and start the tool-server
        uses: ./.github/actions/argent-server

      # android-emulator-runner keeps the emulator alive only for its `script:`.
      # `-grpc` makes the emulator write the grpc.port Argent reads from
      # $XDG_RUNTIME_DIR. `-gpu swiftshader`, not swiftshader_indirect: with the
      # latter Argent's gRPC screenshot comes back as a square 2400x2400 frame
      # and every snapshot step errors.
      - name: Run Argent flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: '4096M'
          disk-size: '10G'
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -no-snapshot-save -grpc 8554
          avd-name: e2e_emulator
          arch: x86_64
          script: ./scripts/e2e/run-argent-flows-android.sh

      # The emulator is gone after the step above, so its script already took
      # screen-at-failure.png.
      - name: Summarize Argent failure
        if: ${{ failure() }}
        run: |
          mkdir -p "$RUNNER_TEMP/argent-out"
          cp "${ARGENT_SERVER_LOG:-/nonexistent}" "$RUNNER_TEMP/argent-out/" 2>/dev/null || true
          scripts/e2e/argent-failure-summary.sh android "$RUNNER_TEMP/argent-out"
      - name: Upload Argent failure artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: argent-android-failure
          path: ${{ runner.temp }}/argent-out
          if-no-files-found: ignore
