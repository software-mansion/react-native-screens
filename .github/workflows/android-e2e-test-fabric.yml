name: Test Android e2e - new architecture
on:
  pull_request:
    # The defaults plus ready_for_review, so marking a draft ready starts a run.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    # PRs run the suite only when the suite itself changes. Library changes
    # are tested once they land on main (see `push`).
    paths:
      - '.github/workflows/android-e2e-test-fabric.yml'
      - 'FabricExample/.detoxrc.js'
      - 'FabricExample/e2e/**'
      - 'scripts/e2e/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-e2e-test-fabric.yml'
      - 'package.json'
      - 'android/**'
      - 'common/**'
      - 'cpp/**'
      - 'src/**'
      - 'FabricExample/**'
      - 'apps/**'
      - 'scripts/e2e/**'
  workflow_dispatch:
concurrency:
  group: android-e2e-fabric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip draft PRs and, in a PR stack, every PR but the lowest unmerged one.
    # Pushes and manual runs carry no `pull_request`, so they always run.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.pull_request.stack == null ||
       github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref)
    env:
      WORKING_DIRECTORY: FabricExample
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install root node dependencies

        run: yarn install && yarn submodules

      - name: Install node dependencies
        id: install_deps
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
        run: yarn install

      - if: steps.install_deps.outcome == 'failure'
        name: Reinstall node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn

      - name: Build app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build-e2e-android

        # Hands the app and test APKs to the test shards (they run on separate
        # machines), keeping the paths Detox's android.release binaryPath expects.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apks
          path: ${{ env.WORKING_DIRECTORY }}/android/app/build/outputs/apk/
          retention-days: 1

  test:
    # The suite is split across shards by Jest's `--shard`, all on the APKs
    # built once above. fail-fast off, so one failing shard does not cancel the
    # others.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        shards: [3]
    name: test (shard ${{ matrix.shard }}/${{ matrix.shards }})
    env:
      WORKING_DIRECTORY: FabricExample
      API_LEVEL: 34
      AVD_PROFILE: pixel_7
      AVD_CORES: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install root node dependencies

        run: yarn install && yarn submodules

      - name: Install node dependencies
        id: install_deps
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
        run: yarn install

      - if: steps.install_deps.outcome == 'failure'
        name: Reinstall node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn

      - name: Download APKs built by the build job
        uses: actions/download-artifact@v4
        with:
          name: build-android-apks
          path: ${{ env.WORKING_DIRECTORY }}/android/app/build/outputs/apk/

      - name: Install AVD dependencies
        # libxkbfile1 is removed by "Free Disk Space (Ubuntu)" step first. Here we install it again
        # as it seems to be needed by the emulator.
        run: |
          sudo apt update
          sudo apt-get install -y libpulse0 libgl1 libxkbfile1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # A snapshot only loads on the hardware config it was taken with.
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-${{ env.AVD_CORES }}cores

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: '4096M'
          disk-size: '10G'
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          avd-name: e2e_emulator
          arch: x86_64
          script: echo "Generated AVD snapshot for caching."

      - name: Run emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          api-level: ${{ env.API_LEVEL }}
          target: default
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: '4096M'
          disk-size: '10G'
          disable-animations: false
          force-avd-creation: false
          # No snapshot on shutdown: on a cache hit nothing reads it, and on a miss it
          # would replace the clean snapshot from the step above in the saved cache.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          avd-name: e2e_emulator
          arch: x86_64
          script: yarn test-e2e-android --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: android-fail-screen-shots-${{ matrix.shard }}
          path: ${{ env.WORKING_DIRECTORY }}/artifacts
