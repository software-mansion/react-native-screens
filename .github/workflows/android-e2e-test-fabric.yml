name: Test Android e2e - new architecture
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-e2e-test-fabric.yml'
      - '.github/actions/argent-server/**'
      - '.argent/**'
      - 'scripts/e2e/run-argent-flows-android.sh'
      - 'package.json'
      - 'android/**'
      - 'common/**'
      - 'FabricExample/**'
      - 'apps/**'
      - 'src/**'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      argent-only:
        description: Skip the Detox tests; only build the app and run the Argent flows.
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKING_DIRECTORY: FabricExample
      API_LEVEL: 34
      AVD_PROFILE: pixel_7
    concurrency:
      group: android-e2e-fabric-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install root node dependencies

        run: yarn install && yarn submodules

      - name: Install node dependencies
        id: install_deps
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
        run: yarn install

      - if: steps.install_deps.outcome == 'failure'
        name: Reinstall node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn

      - name: Install AVD dependencies
        # libxkbfile1 is removed by "Free Disk Space (Ubuntu)" step first. Here we install it again
        # as it seems to be needed by the emulator.
        run: |
          sudo apt update
          sudo apt-get install -y libpulse0 libgl1 libxkbfile1

      - name: Build app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build-e2e-android

      # Hands the release build to the `argent` job (jobs run on separate
      # machines). Internal only — nothing to download from the run page.
      - name: Upload APK for Argent
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apk
          path: ${{ env.WORKING_DIRECTORY }}/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          profile: ${{ env.AVD_PROFILE }}
          ram-size: '4096M'
          disk-size: '10G'
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          avd-name: e2e_emulator
          arch: x86_64
          script: echo "Generated AVD snapshot for caching."

      - name: Run emulator and tests
        if: ${{ !inputs.argent-only }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          api-level: ${{ env.API_LEVEL }}
          target: default
          profile: ${{ env.AVD_PROFILE }}
          ram-size: '4096M'
          disk-size: '10G'
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          avd-name: e2e_emulator
          arch: x86_64
          script: yarn test-e2e-android

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: android-fail-screen-shots
          path: ${{ env.WORKING_DIRECTORY }}/artifacts

  argent:
    # Separate job so the Argent flows get their own time budget and a fresh
    # emulator, whatever state the Detox run left behind. Runs even when Detox
    # failed, as long as the APK artifact was uploaded.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_LEVEL: 34
      AVD_PROFILE: pixel_7
      # The emulator advertises its gRPC console in
      # $XDG_RUNTIME_DIR/avd/running/pid_*.ini, which is where Argent's Android
      # backend looks for it. The variable is unset on runners, so pin it.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    concurrency:
      group: android-argent-fabric-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only needed to run the Argent CLI — the APK is downloaded, not built.
      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Where scripts/e2e/run-argent-flows-android.sh installs it from.
      - name: Download APK built by the test job
        uses: actions/download-artifact@v4
        with:
          name: build-android-apk
          path: FabricExample/android/app/build/outputs/apk/release

      - name: Install AVD dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libpulse0 libgl1 libxkbfile1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator ignores XDG_RUNTIME_DIR if it does not exist, so create it
      # before booting. 0700 per the XDG spec.
      - name: Prepare shared XDG_RUNTIME_DIR
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

      # Same AVD (pixel_7, 1080x2400 — the geometry of the committed Android
      # baselines) as the test job; restored from its cache when present.
      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}

      # Host process; it outlives this step and serves the emulator boot below.
      - name: Install Argent and start the tool-server
        uses: ./.github/actions/argent-server

      # android-emulator-runner keeps the emulator alive only for its `script:`.
      # `-grpc` makes the emulator write the grpc.port Argent reads from
      # $XDG_RUNTIME_DIR.
      - name: Run Argent flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          profile: ${{ env.AVD_PROFILE }}
          ram-size: '4096M'
          disk-size: '10G'
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -grpc 8554
          avd-name: e2e_emulator
          arch: x86_64
          script: ./scripts/e2e/run-argent-flows-android.sh

      # The emulator is gone after the step above, so its script already took
      # screen-at-failure.png.
      - name: Summarize Argent failure
        if: ${{ failure() }}
        run: |
          mkdir -p "$RUNNER_TEMP/argent-out"
          cp "${ARGENT_SERVER_LOG:-/nonexistent}" "$RUNNER_TEMP/argent-out/" 2>/dev/null || true
          scripts/e2e/argent-failure-summary.sh android "$RUNNER_TEMP/argent-out"
      - name: Upload Argent failure artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: argent-android-failure
          path: ${{ runner.temp }}/argent-out
          if-no-files-found: ignore
