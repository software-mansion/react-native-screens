name: Test iOS SPM build

on:
  pull_request:
    branches:
      - main
    paths: &paths
      - '.github/workflows/ios-spm-build-test.yml'
      - 'Package.swift'
      - 'package.json'
      - 'react-native.config.js'
      - 'ios/**'
      - 'common/**'
      - 'cpp/**'
      - 'src/fabric/**'
      - 'FabricExample/ios/**'
      - 'FabricExample/package.json'
      - 'FabricExample/yarn.lock'
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      WORKING_DIRECTORY: FabricExample
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    concurrency:
      group: ios-spm-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/yarn.lock

      - name: Get Xcode version
        run: xcodebuild -version

      - name: Install node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn

      - name: Migrate app to Swift Package Manager
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npx react-native spm --deintegrate --yes

      # `pod deintegrate` leaves the CocoaPods workspace in place and the CLI
      # builds a workspace when it finds one, so drop it to build the project.
      - name: Remove CocoaPods workspace
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: rm -rf FabricExample.xcworkspace

      - name: Build app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npx react-native run-ios --no-packager --simulator="iPhone 17"
