name: Test iOS e2e - new architecture
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ios-e2e-test-fabric.yml'
      - 'RNScreens.podspec'
      - 'package.json'
      - 'ios/**'
      - 'common/**'
      - 'FabricExample/**'
      - 'src/**'
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: xcode-27-xlarge
    timeout-minutes: 90
    env:
      WORKING_DIRECTORY: FabricExample
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    concurrency:
      group: ios-e2e-fabric-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Get Xcode version
        run: xcodebuild -version
      - name: Install AppleSimulatorUtils
        run: brew tap wix/brew && brew trust wix/brew && brew install applesimutils
      - name: Install root node dependencies
        run: yarn install && yarn submodules
      - name: Install node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn
      - name: Install pods
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: pod install
      - name: Build app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build-e2e-ios
      - name: Test app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn test-e2e-ios
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ios-fail-screen-shots
          path: ${{ env.WORKING_DIRECTORY }}/artifacts
