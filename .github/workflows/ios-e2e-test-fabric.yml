name: Test iOS e2e - new architecture
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ios-e2e-test-fabric.yml'
      - '.github/actions/argent-server/**'
      - '.argent/**'
      - 'RNScreens.podspec'
      - 'package.json'
      - 'ios/**'
      - 'common/**'
      - 'FabricExample/**'
      - 'apps/**'
      - 'src/**'
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-26-xlarge
    timeout-minutes: 90
    env:
      WORKING_DIRECTORY: FabricExample
    concurrency:
      group: ios-e2e-fabric-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Use latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Get Xcode version
        run: xcodebuild -version
      - name: Install AppleSimulatorUtils
        run: brew tap wix/brew && brew trust wix/brew && brew install applesimutils
      - name: Install root node dependencies
        run: yarn install && yarn submodules
      - name: Install node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn
        # This step is required due to the bug introduced in 1.15.0 version of cocoapods
        # that breaks the pod installation for cached packages.
        # see https://github.com/facebook/react-native/issues/42698
        # This step should be removed once this issue will be resolved:
        # https://github.com/actions/runner-images/issues/9308
      - name: Install Ruby gems
        run: gem install cocoapods -v 1.15.2
      - name: Install pods
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: pod install
      - name: Build app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build-e2e-ios
      - name: Test app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn test-e2e-ios
      # Reuse the simulator Detox booted (scripts/e2e/ios-devices.js default) and
      # the release build it tested.
      - name: Prepare simulator for Argent
        if: ${{ !cancelled() }}
        env:
          SIM_NAME: iPhone 17
        run: |
          UDID=$(xcrun simctl list devices booted -j | jq -r --arg n "$SIM_NAME" '[.devices[][] | select(.name==$n)][0].udid // empty')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available -j | jq -r --arg n "$SIM_NAME" '[.devices[][] | select(.name==$n)][0].udid // empty')
            if [ -z "$UDID" ]; then
              echo "No available \"$SIM_NAME\" simulator" >&2
              xcrun simctl list devices available >&2
              exit 1
            fi
            xcrun simctl boot "$UDID" || true
          fi
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" "$WORKING_DIRECTORY/ios/build/Build/Products/Release-iphonesimulator/FabricExample.app"
          echo "Using simulator $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Install Argent and start the tool-server
        if: ${{ !cancelled() }}
        uses: ./.github/actions/argent-server
      - name: Run Argent flows
        if: ${{ !cancelled() }}
        run: |
          argent flow run ./.argent/flows --device "$SIMULATOR_UDID" \
            --output "$RUNNER_TEMP/argent-out"
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ios-fail-screen-shots
          path: ${{ env.WORKING_DIRECTORY }}/artifacts
      - name: Upload Argent artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-argent-debug
          path: |
            ${{ runner.temp }}/argent-out
            ${{ runner.temp }}/argent-server.log
          if-no-files-found: ignore
