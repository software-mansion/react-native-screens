name: Test iOS e2e - new architecture
on:
  pull_request:
    # The defaults plus ready_for_review, so marking a draft ready starts a run.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    # PRs run the suite only when the suite itself changes. Library changes
    # are tested once they land on main (see `push`).
    paths:
      - '.github/workflows/ios-e2e-test-fabric.yml'
      - 'FabricExample/.detoxrc.js'
      - 'FabricExample/e2e/**'
      - 'scripts/e2e/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-e2e-test-fabric.yml'
      - 'RNScreens.podspec'
      - 'package.json'
      - 'ios/**'
      - 'common/**'
      - 'cpp/**'
      - 'src/**'
      - 'FabricExample/**'
      - 'apps/**'
      - 'scripts/e2e/**'
  workflow_dispatch:
concurrency:
  group: ios-e2e-fabric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    # Skip draft PRs and, in a PR stack, every PR but the lowest unmerged one.
    # Pushes and manual runs carry no `pull_request`, so they always run. The
    # test jobs need this one, so they are skipped with it.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.pull_request.stack == null ||
       github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref)
    env:
      WORKING_DIRECTORY: FabricExample
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Get Xcode version
        run: xcodebuild -version
      - name: Install root node dependencies
        run: yarn install && yarn submodules
      - name: Install node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn
      - name: Install pods
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: pod install
      - name: Build app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build-e2e-ios
        # Hands the release build to the test jobs (they run on separate
        # machines). tar keeps the executable bit, which upload-artifact drops.
      - name: Package app
        run: |
          tar -czf "$RUNNER_TEMP/FabricExample-app.tar.gz" \
            -C "$WORKING_DIRECTORY/ios/build/Build/Products" Release-iphonesimulator/FabricExample.app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-app
          path: ${{ runner.temp }}/FabricExample-app.tar.gz
          retention-days: 1

  test:
    # iPhone and iPad suites run in parallel on separate machines, both on the
    # app built once above. fail-fast off, so one failing does not cancel the other.
    # Standard (free) runners are slower than xlarge, so the iPhone suite is
    # split into jest shards.
    needs: build
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iphone-1
            script: test-e2e-ios
            args: --shard=1/3
          - name: iphone-2
            script: test-e2e-ios
            args: --shard=2/3
          - name: iphone-3
            script: test-e2e-ios
            args: --shard=3/3
          - name: ipad
            script: test-e2e-ios-ipad
            args: ''
    name: test (${{ matrix.name }})
    env:
      WORKING_DIRECTORY: FabricExample
      # Same Xcode as the build, so the simulator runtime matches the SDK.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Get Xcode version
        run: xcodebuild -version
      - name: Install AppleSimulatorUtils
        run: brew tap wix/brew && brew trust wix/brew && brew install applesimutils
      - name: Install root node dependencies
        run: yarn install && yarn submodules
      - name: Install node dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn
      - name: Download app built by the build job
        uses: actions/download-artifact@v4
        with:
          name: build-ios-app
          path: ${{ runner.temp }}/app
        # Unpacked where Detox's ios.release binaryPath expects it.
      - name: Unpack app
        run: |
          mkdir -p "$WORKING_DIRECTORY/ios/build/Build/Products"
          tar -xzf "$RUNNER_TEMP/app/FabricExample-app.tar.gz" -C "$WORKING_DIRECTORY/ios/build/Build/Products"
      - name: Test app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn ${{ matrix.script }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ios-fail-screen-shots-${{ matrix.name }}
          path: ${{ env.WORKING_DIRECTORY }}/artifacts
