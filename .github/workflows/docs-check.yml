name: Publish Screens landing page
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  push:
    branches:
      - main
    paths: docs/**
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'software-mansion/react-native-screens'
    runs-on: ubuntu-latest
    concurrency:
        group: docs-check-${{ github.ref }}
        cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Generate landing page content
        run: >-
          git config --local user.email "action@github.com"
          && git config --local user.name "GitHub Action"
          && cd docs
          && yarn
          && yarn build

      - name: Check docs llms.txt
        run: |
          file=docs/build/llms.txt
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing or empty"
            exit 1
          fi
          count=$(grep -cE '^- \[[^]]+\]\(https://docs\.swmansion\.com/react-native-screens/[^)]+\)' "$file" || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::$file lists no pages"
            exit 1
          fi
          echo "llms.txt lists $count pages"
      - name: Publish generated content to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          FOLDER: docs/build
          BRANCH: gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
